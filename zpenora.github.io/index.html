<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝑨𝒉𝒎𝒆𝒅 𝑺𝒉𝒂𝒃𝒂𝒏 | Link Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Cairo', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Cairo', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* Base Glass Styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            transition: all 0.5s ease;
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dark .glass-button {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-button:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        .dark .glass-button:hover {
            background: rgba(51, 65, 85, 0.7);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* --- 2 STYLE PRESETS --- */
        /* Style 2: Vibrant Glow */
        body.style-vibrant {
            background-color: #0d0f1a !important;
        }
        body.style-vibrant .theme-bg-glow1 { background: #ff0050 !important; }
        body.style-vibrant .theme-bg-glow2 { background: #8a2be2 !important; }
        body.style-vibrant .theme-bg-glow3 { background: #25f4ee !important; }
        body.style-vibrant .theme-border-avatar { background: linear-gradient(135deg, #25f4ee, #ff0050, #8a2be2); }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(3deg); }
        }
        .animate-float-slow { animation: float 8s ease-in-out infinite; }
        .animate-float-fast { animation: float 5s ease-in-out infinite reverse; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
    </style>
</head>
<body id="mainBody" class="min-h-screen bg-slate-900 text-slate-100 transition-colors duration-500 relative flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- Background Animated Glows -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div id="glow1" class="theme-bg-glow1 absolute -top-40 -left-40 w-96 h-96 bg-purple-500/30 rounded-full filter blur-[100px] animate-float-slow transition-all duration-700"></div>
        <div id="glow2" class="theme-bg-glow2 absolute top-1/3 -right-40 w-96 h-96 bg-sky-500/30 rounded-full filter blur-[100px] animate-float-fast transition-all duration-700"></div>
        <div id="glow3" class="theme-bg-glow3 absolute -bottom-40 left-1/3 w-96 h-96 bg-pink-500/20 rounded-full filter blur-[100px] animate-float-slow transition-all duration-700"></div>
    </div>

    <!-- Top Navigation / Controls Bar -->
    <header class="relative z-10 w-full px-4 py-4 flex flex-col sm:flex-row gap-3 justify-between items-center max-w-2xl mx-auto">
        <!-- Status Indicator -->
        <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs font-semibold tracking-wider uppercase text-slate-400" data-i18n="status">Online</span>
        </div>

        <!-- Controls (Language, Theme, 2-Style Switcher) -->
        <div class="flex items-center gap-2 flex-wrap justify-center">
            <!-- 2-Style Switcher -->
            <button id="styleToggleBtn" onclick="toggleStylePreset()" class="glass-button px-3.5 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 shadow-sm text-sky-400">
                <i class="fa-solid fa-palette"></i>
                <span id="styleBtnText" data-i18n="styleModern">Style: Modern Glass</span>
            </button>

            <!-- Language Toggle Button -->
            <button id="langToggle" onclick="toggleLanguage()" class="glass-button px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-globe text-sky-400"></i>
                <span id="langText">AR</span>
            </button>

            <!-- Light/Dark Theme Toggle Button -->
            <button id="themeToggle" onclick="toggleTheme()" class="glass-button w-9 h-9 rounded-full flex items-center justify-center text-sm shadow-sm" title="Toggle Light/Dark">
                <i id="themeIcon" class="fa-solid fa-moon text-sky-300"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 w-full max-w-lg mx-auto px-4 py-2 flex flex-col items-center flex-grow">
        
        <!-- Profile Picture & Info Card -->
        <div class="glass-card w-full rounded-3xl p-6 sm:p-8 flex flex-col items-center text-center mb-6 transition-all duration-300">
            <!-- Avatar with Glowing Dynamic Border -->
            <div class="relative mb-4 group">
                <div id="avatarBorder" class="theme-border-avatar absolute -inset-1.5 bg-gradient-to-r from-purple-600 via-sky-500 to-pink-500 rounded-full blur opacity-85 group-hover:opacity-100 transition duration-500 animate-tilt"></div>
                <div class="relative w-32 h-32 sm:w-36 sm:h-36 rounded-full overflow-hidden border-2 border-white/30 shadow-2xl bg-slate-800">
                    <img id="userAvatar" src="image.png" alt="Ahmed Shaban" class="w-full h-full object-cover object-center transform group-hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/400x400/1e293b/ffffff?text=Ahmed+Shaban'">
                </div>
            </div>

            <!-- Profile Name -->
            <h1 class="text-2xl sm:text-3xl font-black tracking-wide bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent mb-2">
                𝑨𝒉𝒎𝒆𝒅 𝑺𝒉𝒂𝒃𝒂𝒏
            </h1>

            <!-- Live Location Badge -->
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/10 dark:bg-white/5 border border-white/10 text-xs sm:text-sm font-medium text-slate-300 mb-4 shadow-inner">
                <i class="fa-solid fa-location-dot text-rose-400 animate-bounce"></i>
                <span data-i18n="location">From Egypt in Alexandria</span>
            </div>

            <!-- Bio / Subtitle -->
            <p class="text-sm sm:text-base text-slate-300/90 max-w-xs leading-relaxed" data-i18n="bio">
                Welcome to my official hub! Connect with me across my social platforms below.
            </p>
        </div>

        <!-- Links List -->
        <div class="w-full space-y-3.5">
            
            <!-- TikTok Link -->
            <a href="https://www.tiktok.com/@zpevnora" target="_blank" rel="noopener noreferrer" class="glass-button w-full rounded-2xl p-4 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-black/80 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <div class="text-left rtl:text-right">
                        <h2 class="font-bold text-base sm:text-lg group-hover:text-cyan-400 transition-colors">TikTok</h2>
                        <p class="text-xs text-slate-400">@zpevnora</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-slate-300 group-hover:bg-cyan-500 group-hover:text-white transition-all">
                    <i class="fa-solid fa-arrow-right rtl:rotate-180 text-xs"></i>
                </div>
            </a>

            <!-- YouTube Link -->
            <a href="https://youtube.com/@ahmedshaban_40" target="_blank" rel="noopener noreferrer" class="glass-button w-full rounded-2xl p-4 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-red-600/90 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                    <div class="text-left rtl:text-right">
                        <h2 class="font-bold text-base sm:text-lg group-hover:text-red-400 transition-colors">YouTube</h2>
                        <p class="text-xs text-slate-400">@ahmedshaban_40</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-slate-300 group-hover:bg-red-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-arrow-right rtl:rotate-180 text-xs"></i>
                </div>
            </a>

            <!-- Instagram Link -->
            <a href="https://instagram.com/ahmedshaban_40" target="_blank" rel="noopener noreferrer" class="glass-button w-full rounded-2xl p-4 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <div class="text-left rtl:text-right">
                        <h2 class="font-bold text-base sm:text-lg group-hover:text-pink-400 transition-colors">Instagram</h2>
                        <p class="text-xs text-slate-400">@ahmedshaban_40</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-slate-300 group-hover:bg-pink-500 group-hover:text-white transition-all">
                    <i class="fa-solid fa-arrow-right rtl:rotate-180 text-xs"></i>
                </div>
            </a>

            <!-- WhatsApp Link -->
            <a href="https://wa.me/966543880542" target="_blank" rel="noopener noreferrer" class="glass-button w-full rounded-2xl p-4 flex items-center justify-between group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-emerald-600/90 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <div class="text-left rtl:text-right">
                        <h2 class="font-bold text-base sm:text-lg group-hover:text-emerald-400 transition-colors" data-i18n="whatsappTitle">WhatsApp Chat</h2>
                        <p class="text-xs text-slate-400" dir="ltr">+966 54 388 0542</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-slate-300 group-hover:bg-emerald-600 group-hover:text-white transition-all">
                    <i class="fa-solid fa-arrow-right rtl:rotate-180 text-xs"></i>
                </div>
            </a>

        </div>

        <!-- Share Profile Button -->
        <button onclick="shareProfile()" class="mt-6 w-full py-3.5 rounded-2xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold text-sm shadow-lg shadow-sky-500/25 hover:shadow-sky-500/40 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-share-nodes"></i>
            <span data-i18n="shareBtn">Share Profile</span>
        </button>

    </main>

    <footer class="relative z-10 w-full py-6 text-center text-xs text-slate-400">
        <p>© <span id="year"></span> 𝑨𝒉𝒎𝒆𝒅 𝑺𝒉𝒂𝒃𝒂𝒏. <span data-i18n="rights">All rights reserved.</span></p>
    </footer>

    <script>
        // Set current year dynamically
        document.getElementById('year').textContent = new Date().getFullYear();

        // Multilingual dictionary
        const translations = {
            en: {
                status: "Online",
                location: "From Egypt in Alexandria",
                bio: "Welcome to my official hub! Connect with me across my social platforms below.",
                whatsappTitle: "WhatsApp Chat",
                shareBtn: "Share Profile",
                rights: "All rights reserved.",
                copyMsg: "Link copied to clipboard!",
                styleModern: "Style: Modern Glass",
                styleVibrant: "Style: Vibrant Glow"
            },
            ar: {
                status: "متصل الآن",
                location: "من مصر - الإسكندرية",
                bio: "أهلاً بك في صفحتي الرسمية! تواصل معي عبر منصات التواصل الاجتماعي أدناه.",
                whatsappTitle: "مراسلة واتساب",
                shareBtn: "مشاركة الملف الشخصي",
                rights: "جميع الحقوق محفوظة.",
                copyMsg: "تم نسخ الرابط إلى الحافظة!",
                styleModern: "النمط: زجاجي عصري",
                styleVibrant: "النمط: متوهج حيوي"
            }
        };

        let currentLang = 'en';
        let currentTheme = 'dark';
        let isVibrantStyle = false;

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const html = document.documentElement;
            
            if (currentLang === 'ar') {
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', 'ar');
                document.getElementById('langText').textContent = 'EN';
            } else {
                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', 'en');
                document.getElementById('langText').textContent = 'AR';
            }

            updateTexts();
        }

        function updateTexts() {
            const t = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });

            // Update style button label specifically
            const styleTextEl = document.getElementById('styleBtnText');
            if (styleTextEl) {
                styleTextEl.textContent = isVibrantStyle ? t.styleVibrant : t.styleModern;
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                if (!isVibrantStyle) {
                    document.body.style.backgroundColor = '#f8fafc';
                }
                themeIcon.className = "fa-solid fa-sun text-amber-500";
                currentTheme = 'light';
            } else {
                html.classList.add('dark');
                if (!isVibrantStyle) {
                    document.body.style.backgroundColor = '#0f172a';
                }
                themeIcon.className = "fa-solid fa-moon text-sky-300";
                currentTheme = 'dark';
            }
        }

        // Toggle between the 2 Styles (Modern Glass & Vibrant Glow)
        function toggleStylePreset() {
            const body = document.getElementById('mainBody');
            isVibrantStyle = !isVibrantStyle;

            if (isVibrantStyle) {
                body.classList.add('style-vibrant');
            } else {
                body.classList.remove('style-vibrant');
                if (currentTheme === 'light') {
                    document.body.style.backgroundColor = '#f8fafc';
                } else {
                    document.body.style.backgroundColor = '#0f172a';
                }
            }

            updateTexts();
        }

        function shareProfile() {
            const url = window.location.href;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast(translations[currentLang].copyMsg);
                }).catch(() => {
                    fallbackCopy(url);
                });
            } else {
                fallbackCopy(url);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(translations[currentLang].copyMsg);
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showToast(message) {
            const existingToast = document.getElementById('toastNotification');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'toastNotification';
            toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 glass-card px-6 py-3 rounded-full text-sm font-semibold shadow-2xl flex items-center gap-2 border border-sky-500/30 text-sky-400 animate-bounce';
            toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
